# Render blueprint for the Spring Boot backend.
# Create/update the service with:  New > Blueprint > select this repository.
# The only value you must supply is the database password (sync: false).

services:
  - type: web
    name: tt-exam-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: free
    envVars:
      # Aiven MySQL, verified TLS. The CA truststore ships inside the Docker image.
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:mysql://mysql-1a44b520-codementorai.d.aivencloud.com:17960/defaultdb?sslMode=VERIFY_IDENTITY"
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Frontend origins allowed to call the API.
      # TODO: replace the Netlify URL with the exact origin of your deployed site.
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://24eg107d47tt.netlify.app,http://localhost:5173
      # Schema management (only takes effect once JPA entities exist).
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      # Verified TLS with the truststore bundled in the image (also set in the Dockerfile).
      - key: SPRING_PROFILES_ACTIVE
        value: verified-tls
      - key: DB_TRUST_STORE_URL
        value: file:/app/certs/aiven-truststore.p12
      - key: DB_TRUST_STORE_PASSWORD
        value: changeit
      - key: DB_TRUST_STORE_TYPE
        value: PKCS12
