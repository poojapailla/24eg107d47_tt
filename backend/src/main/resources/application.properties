# Full Stack Lab Exam - backend configuration
# Every secret is read from an environment variable. Nothing sensitive is committed here.
#
# Precedence (highest first):
#   1. OS environment variables   (Render dashboard / shell)
#   2. backend/.env                (local development, git-ignored, loaded via spring.config.import)
#   3. the defaults written below
#
# This means the exact same jar works locally and on Render without code changes.

spring.application.name=lab-exam-backend

# Render injects PORT automatically; 8080 is the local default.
server.port=${PORT:8080}

# Local secrets file. Optional: on Render these values come from the environment instead.
spring.config.import=optional:file:.env[.properties]

# ---------- Database (Aiven MySQL) ----------
# Aiven project "31369ece-619a-48b0-9529-fb60aab0099c" - service "mysql".
# Set these in Render (or locally) as environment variables:
#   SPRING_DATASOURCE_URL=jdbc:mysql://mysql-1a44b520-codementorai.d.aivencloud.com:17960/defaultdb?sslMode=REQUIRED
#   SPRING_DATASOURCE_USERNAME=avnadmin
#   SPRING_DATASOURCE_PASSWORD=<aiven-password>
# The URL below is only a host/port/database default - it carries no credential.
# REQUIRED encrypts the traffic; the .env / Render config upgrades it to VERIFY_IDENTITY
# with the bundled Aiven CA truststore (see the TLS section below).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-1a44b520-codementorai.d.aivencloud.com:17960/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=lab-exam-pool

# ---------- TLS truststore ----------
# sslMode=REQUIRED (the default URL) encrypts the connection and Connector/J ignores
# the truststore settings below, so they are harmless for a plain local run.
# For verified TLS (sslMode=VERIFY_IDENTITY) the Aiven project CA must be present:
# the Docker image ships it at /app/certs/aiven-truststore.p12 (built from
# src/main/resources/tls/aiven-ca.pem), and backend/.env overrides DB_TRUST_STORE_URL
# with the absolute local path produced by scripts/setup-aiven-tls.ps1.
#
# Never leave trustCertificateKeyStoreUrl empty: an empty value makes Connector/J
# verify against the JRE default truststore and fail with
#   CertPathValidatorException: Path does not chain with any of the trust anchors
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${DB_TRUST_STORE_URL:file:/app/certs/aiven-truststore.p12}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${DB_TRUST_STORE_PASSWORD:changeit}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=${DB_TRUST_STORE_TYPE:PKCS12}

# ---------- JPA ----------
# The schema is managed by JPA when entities are added. Has no effect while the
# project only uses spring-boot-starter-jdbc (JdbcTemplate).
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# ---------- CORS ----------
# Comma separated list of frontend origins, e.g. https://your-site.netlify.app,http://localhost:5173
# APP_CORS_ALLOWED_ORIGINS is the name used by the Render/Aiven env vars.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:https://24eg107d47tt.netlify.app,http://localhost:5173}}

# ---------- Logging ----------
# Never log credentials or full connection strings.
logging.level.root=INFO
logging.level.com.tt.labexam=INFO
