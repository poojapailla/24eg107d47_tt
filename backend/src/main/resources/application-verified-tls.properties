# Optional profile for VERIFIED TLS against Aiven MySQL.
# Activate with SPRING_PROFILES_ACTIVE=verified-tls (the Docker image already sets it).
#
# The base application.properties points at the same truststore (/app/certs/...), so
# this profile is not required locally: backend/.env overrides DB_TRUST_STORE_URL with
# the absolute path produced by scripts/setup-aiven-tls.ps1.
#
# Why: sslMode=REQUIRED encrypts the connection but does not verify the server certificate.
# For verified TLS the Aiven CA certificate must be converted to a keystore and mounted
# into the container. See the README section "Aiven MySQL - verified TLS".
#
# Then set in Render:
#   SPRING_DATASOURCE_URL=jdbc:mysql://mysql-1a44b520-codementorai.d.aivencloud.com:17960/defaultdb?sslMode=VERIFY_IDENTITY
#   SPRING_PROFILES_ACTIVE=verified-tls
#   DB_TRUST_STORE_URL=file:/app/certs/aiven-truststore.p12
#   DB_TRUST_STORE_PASSWORD=<keystore password>
#   DB_TRUST_STORE_TYPE=PKCS12
#
# The Docker image already ships the truststore at /app/certs/aiven-truststore.p12,
# so DB_TRUST_STORE_URL only needs to be set when you use a custom truststore.

spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${DB_TRUST_STORE_URL:file:/app/certs/aiven-truststore.p12}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${DB_TRUST_STORE_PASSWORD:changeit}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=${DB_TRUST_STORE_TYPE:PKCS12}
