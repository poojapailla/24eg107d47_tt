name: tt-exam

# Local development stack: MySQL + Spring Boot backend + Vite/React frontend.
# Run from the repository root:  docker compose up --build
services:
  mysql:
    image: mysql:8.0
    container_name: tt-exam-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lab_exam}
      MYSQL_USER: ${MYSQL_USER:-labexam}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-labexam}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-labexam_root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-labexam_root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tt-exam-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      # Local MySQL has no TLS, so sslMode is disabled here. The Aiven/production
      # connection string (with sslMode=REQUIRED) is supplied through Render.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-lab_exam}?sslMode=DISABLED
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-labexam}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-labexam}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: tt-exam-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  mysql-data:
